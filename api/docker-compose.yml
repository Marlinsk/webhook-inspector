services:
  postgres:
    image: postgres:17-alpine
    container_name: webhook_inspector_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: webhook_inspector
    ports:
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d webhook_inspector']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: webhook_inspector_postgres_data